name: PWN native read-only market check
on:
  push:
    branches: [ept-liquidity-20260923]
    paths: [.github/workflows/pwn-native-readonly-20260923.yml]
permissions: {}
jobs:
  native-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query native creation metadata and existing public proposals
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, urllib.request, urllib.error, urllib.parse
          host='https://api.pwn.xyz'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          calls=[
            ('native_create_metadata','OPTIONS','/api/v2/pwn_contracts/proposal/'),
            ('exact_request_id','GET','/api/v2/pwn_contracts/proposal-and-loan/?q=ept-internal-use-15000&includeUnverifiedCollateral=true&includeCollateralWithoutPrice=true&limit=20'),
            ('seller_name','GET','/api/v2/pwn_contracts/proposal-and-loan/?q=Wheeler&includeUnverifiedCollateral=true&includeCollateralWithoutPrice=true&limit=20')]
          report={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'financial_signatures':False,'transactions':False,'results':[]}
          for label,method,path in calls:
              item={'label':label,'method':method,'url':host+path}
              try:
                  req=urllib.request.Request(host+path,headers={'Accept':'application/json','User-Agent':'WHP-native-interface/1.0'},method=method)
                  try: r=opener.open(req,timeout=20)
                  except urllib.error.HTTPError as e: r=e
                  with r:
                      raw=r.read(1048577)
                      item.update(status=r.code,allow=r.headers.get('Allow'),date=r.headers.get('Date'),sha256=hashlib.sha256(raw).hexdigest())
                  if len(raw)>1048576: item['error']='response too large'
                  else:
                      try: item['body']=json.loads(raw)
                      except ValueError: item['body_excerpt']=raw[:800].decode('utf-8','replace')
              except Exception as e: item['error']=str(e)
              report['results'].append(item)
              print('NATIVE_INTERFACE_RESULT '+json.dumps(item,sort_keys=True))
          print('NATIVE_INTERFACE_REPORT '+json.dumps(report,sort_keys=True))
          PY
