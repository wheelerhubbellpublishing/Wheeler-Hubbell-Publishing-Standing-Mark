name: PWN native read-only market check
on:
  push:
    branches: [ept-liquidity-20260923]
    paths: [.github/workflows/pwn-native-readonly-20260923.yml]
permissions: {}
jobs:
  native-capital-terms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query native strategies and capital terms without signing or spending
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, urllib.error, urllib.parse, urllib.request
          HOST='https://api.pwn.xyz'
          MAX_BODY=4*1024*1024
          WALLET='0xdbb1c7dcf901c9b76e5943c27ad652cfc7f61135'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          def read(url):
              u=urllib.parse.urlparse(url)
              if u.scheme!='https' or u.netloc!='api.pwn.xyz' or not u.path.startswith('/api/v2/pwn_contracts/'):
                  raise ValueError('OUTSIDE_DOCUMENTED_PWN_API')
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'WHP-capital-terms-readonly/1.1'},method='GET')
              try: response=opener.open(req,timeout=20)
              except urllib.error.HTTPError as exc: response=exc
              with response:
                  raw=response.read(MAX_BODY+1)
                  meta={'url':url,'http_status':response.code,'response_date':response.headers.get('Date'),'sha256':hashlib.sha256(raw).hexdigest()}
              if len(raw)>MAX_BODY: raise ValueError('RESPONSE_TOO_LARGE')
              try: data=json.loads(raw)
              except ValueError: data={'unparsed_excerpt':raw[:400].decode('utf8','replace')}
              return meta,data
          common={'isOffer':'true','statuses':'1','includeLoans':'false','includeProposals':'true','includeUnverifiedCollateral':'true','includeCollateralWithoutPrice':'true','includeUnverifiedCredit':'true','includeCreditWithoutPrice':'true','limit':'100'}
          make=lambda p: HOST+'/api/v2/pwn_contracts/proposal-and-loan/?'+urllib.parse.urlencode(p)
          queries=[('public_strategies',HOST+'/api/v2/pwn_contracts/thesis/?limit=100',2),
                   ('open_offers_all_chains',make(common),4),
                   ('offers_matching_designated_borrower',make(dict(common,borrowerAddress=WALLET)),2)]
          report={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'request_id':'ept-internal-use-15000','operation':'NATIVE_PUBLIC_READ','financial_transactions':False,'wallet_signatures':False,'new_hosting':False,'queries':[]}
          for label,url,maxpages in queries:
              result={'label':label,'pages':[],'rows':[],'coverage':'UNVERIFIED'}
              seen=set()
              for page in range(maxpages):
                  if not url or url in seen: break
                  seen.add(url)
                  try:
                      meta,data=read(url)
                      if not isinstance(data,dict):
                          meta['error']='UNEXPECTED_RESPONSE';result['pages'].append(meta);break
                      rows=data.get('results')
                      meta.update(api_count=data.get('count'),returned_rows=len(rows) if isinstance(rows,list) else None,next=data.get('next'))
                      result['pages'].append(meta)
                      if meta['http_status']!=200 or not isinstance(rows,list):
                          meta['body']=data;result['coverage']='API_READ_FAILED';break
                      for row in rows:
                          if label=='public_strategies':
                              result['rows'].append({k:row.get(k) for k in ['id','title','slug','description','chainId','isActive','isHidden','curator','collateralAssets','creditsStats','loanDurationDays','aprMin','aprMax']})
                          else:
                              s=row.get('proposalSpecificData') or {}
                              result['rows'].append({'id':row.get('id'),'chainId':row.get('chainId'),'status':row.get('status'),'isOffer':row.get('isOffer'),'collateral':row.get('collateral'),'creditAsset':row.get('creditAsset'),'creditData':row.get('creditData'),'duration':row.get('duration'),'expiration':row.get('expiration'),'proposer':row.get('proposer'),'allowedAcceptor':s.get('allowedAcceptor',row.get('allowedAcceptor')),'sourceOfFunds':row.get('sourceOfFunds'),'relatedThesisId':row.get('relatedThesisId'),'signature_present':bool(s.get('signature',row.get('signature'))),'proposalContractAddress':row.get('proposalContractAddress'),'loanContract':row.get('loanContract')})
                      url=data.get('next')
                      if not url:
                          result['coverage']='RETURNED_PAGINATION_EXHAUSTED';break
                  except Exception as exc:
                      result['error']=type(exc).__name__+': '+str(exc);result['coverage']='READ_FAILED';break
              if url and result['coverage']=='UNVERIFIED': result['coverage']='PAGE_LIMIT_REACHED'
              result['observed_rows']=len(result['rows'])
              print('CAPITAL_QUERY '+json.dumps(result,sort_keys=True,separators=(',',':')))
              report['queries'].append({k:v for k,v in result.items() if k!='rows'})
          report['boundary']='These are provider-listed strategies/offers, not independent signature/funding verification or acceptance. A borrower filter match is not a collateral match. Only an offer actually covering the WHP payment right can fund it; no token value, lender consent or sponsorship is inferred.'
          print('CAPITAL_CHECK_REPORT '+json.dumps(report,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as f:
              f.write('# Native capital terms check\n\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
          PY
