name: Verify generated Hostinger gateway

on:
  push:
    branches:
      - hostinger-mcp-transport
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public gateway
        shell: bash
        run: |
          set -u
          base="https://skyblue-wombat-114046.hostingersite.com"

          echo "=== HOME ==="
          home_code="$(curl --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 -sS -L -D home.headers -o home.body -w '%{http_code}' "$base/" || true)"
          echo "status=$home_code"
          sed -n '1,30p' home.headers || true
          head -c 2000 home.body || true
          echo

          echo "=== GATEWAY HEALTH ==="
          health_code="$(curl --retry 3 --retry-all-errors --retry-delay 10 --max-time 30 -sS -D health.headers -o health.body -w '%{http_code}' "$base/__gateway-health" || true)"
          echo "status=$health_code"
          sed -n '1,30p' health.headers || true
          head -c 2000 health.body || true
          echo

          echo "=== MCP INITIALIZE ==="
          payload='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-verifier","version":"1.0.0"}}}'
          mcp_code="$(curl --retry 3 --retry-all-errors --retry-delay 10 --max-time 60 -sS -D mcp.headers -o mcp.body -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' --data-binary "$payload" "$base/mcp" || true)"
          echo "status=$mcp_code"
          sed -n '1,40p' mcp.headers || true
          head -c 4000 mcp.body || true
          echo

          test "$home_code" = "200"
          test "$mcp_code" = "200"
          ! grep -Eiq '<!doctype html|<html' mcp.body
          grep -Eq '"jsonrpc"|event: message|data: ' mcp.body
